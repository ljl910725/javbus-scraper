# ============================================================
# JavBus 爬虫 - 飞牛OS 本地构建部署（需要完整项目文件）
# ============================================================
#
# 【前提】目录内必须包含：Dockerfile、requirements.txt、app/、static/
# 若只有 yml 文件会报：open Dockerfile: no such file or directory
#
# 【更简单的方式】用 docker-compose.image.yml（只需 yml + data/downloads）
# ============================================================

services:
  javbus-scraper:
    build: .
    image: javbus-scraper:local
    pull_policy: build
    container_name: javbus-scraper
    restart: unless-stopped
    ports:
      - "18000:8000"
    environment:
      TZ: Asia/Shanghai
      JWT_SECRET: change-me-to-a-random-secret
      BASE_URL: https://www.javbus.com
      PUSH_BACKEND: cd2
      # TORRENTS_API_URL: http://192.168.1.135:8081/api/v1/articles/torrents
      # TORRENTS_API_KEY: your-api-key
    volumes:
      # 格式：宿主机路径:容器内路径（右侧必须是 /app/...）
      - ./data:/app/data
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
